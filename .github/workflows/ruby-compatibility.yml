name: Ruby gem compatibility

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Payload gem - Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4', '4.0', '3.5.0-preview1']
    defaults:
      run:
        working-directory: gem
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: gem
          bundler-cache: true
      - name: Run gem specs
        run: bundle exec rspec
